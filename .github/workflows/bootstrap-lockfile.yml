name: SAGE lockfile bootstrap

on:
  push:
    branches: [phase-15-release-engineering]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-15-release-engineering
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-lockfile.yml
          git commit -m "Phase 15: add npm lockfile generated by npm"
          git push origin HEAD:phase-15-release-engineering
