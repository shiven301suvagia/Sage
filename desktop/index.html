<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGE</title>
<style>
:root{--gold:#f0b44b;--cream:#fff6df;--panel:rgba(10,14,20,.97)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Segoe UI,Arial,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none}
button,input{font:inherit}
.stage{position:relative;width:100%;height:100%;background:transparent}
.character-area{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sage{width:168px;height:310px;object-fit:contain;object-position:center bottom;pointer-events:auto;cursor:grab;draggable:false;-webkit-user-drag:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));opacity:.62;transition:opacity .25s ease,filter .25s ease,transform .2s ease}
.sage.active{opacity:1;filter:drop-shadow(0 0 24px rgba(244,181,64,.48)) drop-shadow(0 12px 22px rgba(0,0,0,.3));transform:scale(1.015)}
.sage:active{cursor:grabbing}
.status{position:absolute;right:8px;bottom:5px;font-size:9px;color:rgba(255,246,223,.62);pointer-events:none}
.net{position:absolute;left:6px;bottom:4px;border:0;background:none;color:rgba(255,246,223,.62);font-size:9px;cursor:pointer;z-index:8}
.net.on{color:#79d59b}
.bubble{position:absolute;left:12px;top:12px;max-width:300px;padding:10px 13px;border:1px solid rgba(244,181,64,.55);border-radius:16px 16px 16px 5px;background:rgba(12,16,23,.96);box-shadow:0 10px 30px rgba(0,0,0,.34);font-size:12px;line-height:1.4;opacity:0;pointer-events:none;transform:translateY(6px);transition:.2s;z-index:7}
.bubble.show{opacity:1;transform:none}
.panel{position:absolute;left:12px;right:12px;bottom:12px;padding:13px;border:1px solid rgba(244,181,64,.4);border-radius:18px;background:var(--panel);box-shadow:0 18px 55px rgba(0,0,0,.46);opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;z-index:10}
.panel.show{opacity:1;pointer-events:auto;transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:700;letter-spacing:.2px}
.panel-head span:last-child{font-size:10px;font-weight:400;color:rgba(255,246,223,.55)}
.form{display:flex;gap:7px}.form input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.13);border-radius:11px;background:rgba(255,255,255,.065);color:var(--cream);padding:10px;outline:none;user-select:text;-webkit-user-select:text}.form input:focus{border-color:rgba(244,181,64,.7);box-shadow:0 0 0 2px rgba(244,181,64,.12)}
.send{border:0;border-radius:11px;background:var(--gold);color:#18130a;font-weight:800;padding:0 13px;cursor:pointer}.send:active{transform:translateY(1px)}
.actions{display:flex;gap:7px;margin-top:8px}.action{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.055);color:#e9e1d0;padding:7px;cursor:pointer}.action:hover{background:rgba(255,255,255,.09)}
.voice.listening{border-color:rgba(121,213,155,.6);background:rgba(121,213,155,.13);color:#bff3d1}
.close{border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.045);color:#cfc7b7;padding:7px 12px;cursor:pointer}
.help{margin-top:8px;text-align:center;color:rgba(255,246,223,.4);font-size:9px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.float{animation:float 4.6s ease-in-out infinite;transform-origin:50% 100%}
.reduced *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="bubble" id="bubble"></div>
  <div class="character-area"><img class="sage float" id="sage" src="./assets/sage-fullbody.webp" alt="SAGE desktop companion" tabindex="0" draggable="false"></div>
  <div class="status" id="status">Idle · 62%</div>
  <button class="net" id="net" type="button">Offline</button>
  <section class="panel" id="panel" aria-label="Talk to SAGE">
    <div class="panel-head"><span>SAGE</span><span id="mode">Local-first · ready</span></div>
    <form class="form" id="form"><input id="message" autocomplete="off" maxlength="4000" placeholder="Talk to SAGE…" aria-label="Message SAGE"><button class="send" type="submit">Send</button></form>
    <div class="actions"><button class="action voice" id="voice" type="button">🎙 Talk</button><button class="close" id="close" type="button">Close</button></div>
    <div class="help">Double-click SAGE to talk · drag her to move</div>
  </section>
</main>
<script>
const sage=document.querySelector('#sage'),bubble=document.querySelector('#bubble'),panel=document.querySelector('#panel'),form=document.querySelector('#form'),input=document.querySelector('#message'),status=document.querySelector('#status'),net=document.querySelector('#net'),close=document.querySelector('#close'),voice=document.querySelector('#voice'),mode=document.querySelector('#mode'),stage=document.querySelector('#stage');
let timer,hide,dragging=false,dragStart=null,moved=false;
const desktop=window.sageDesktop;
function state(label,on=false){sage.classList.toggle('active',on);status.textContent=on?label:'Idle · 62%';clearTimeout(timer);if(on)timer=setTimeout(()=>state('Idle · 62%',false),6500)}
function say(text){if(!text)return;bubble.textContent=text;bubble.classList.add('show');clearTimeout(hide);hide=setTimeout(()=>bubble.classList.remove('show'),5200)}
async function setMode(modeName){await desktop?.resizeMode?.(modeName);}
async function openPanel(){state('Ready · SAGE',true);await setMode('chat');panel.classList.add('show');await desktop?.setInteractive(true);input.focus()}
async function closePanel(){panel.classList.remove('show');await desktop?.setInteractive(true);await setMode('compact');state('Idle · 62%',false)}
sage.addEventListener('dragstart',e=>e.preventDefault());
sage.addEventListener('dblclick',openPanel);
sage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel()}});
close.addEventListener('click',closePanel);
sage.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();dragging=true;moved=false;dragStart={x:e.screenX,y:e.screenY};sage.setPointerCapture(e.pointerId);state('Awake · SAGE',true)});
sage.addEventListener('pointermove',e=>{if(!dragging||!dragStart)return;e.preventDefault();const dx=e.screenX-dragStart.x,dy=e.screenY-dragStart.y;if(Math.abs(dx)+Math.abs(dy)<2)return;moved=true;desktop?.moveBy?.(dx,dy);dragStart={x:e.screenX,y:e.screenY}});
sage.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;dragStart=null;sage.releasePointerCapture?.(e.pointerId);if(moved)say('Here we are.');state('Awake · SAGE',true)});
sage.addEventListener('pointercancel',()=>{dragging=false;dragStart=null});
async function ask(text){const t=String(text||'').trim();if(!t)return;state('Thinking · SAGE',true);say('Thinking…');mode.textContent='Thinking';try{const r=await desktop?.ask?.(t);if(r?.ok){state('Speaking · SAGE',true);say(r.text);speak(r.text);mode.textContent='Ready'}else{say(r?.text||'I could not process that yet.');mode.textContent='Ready'}}catch(error){console.error(error);say('Something went wrong while I was thinking.');mode.textContent='Error'}}
form.addEventListener('submit',async e=>{e.preventDefault();const t=input.value.trim();input.value='';await ask(t);input.focus()});
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.rate=.98;u.pitch=1.08;speechSynthesis.cancel();speechSynthesis.speak(u)}
let rec=null,listening=false;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R){rec=new R();rec.lang='en-IN';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{listening=true;voice.classList.add('listening');voice.textContent='⏹ Listening…';state('Listening · SAGE',true);say('I’m listening.')};rec.onend=()=>{listening=false;voice.classList.remove('listening');voice.textContent='🎙 Talk'};rec.onerror=()=>{listening=false;voice.classList.remove('listening');voice.textContent='🎙 Talk';say('I couldn’t hear that. Try again.')};rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim();if(t){input.value=t;void ask(t)}};voice.onclick=()=>{try{listening?rec.stop():rec.start()}catch{}}}else{voice.disabled=true;voice.title='Speech recognition is not available in this environment'}
net.addEventListener('click',async()=>{const n=Boolean(await desktop?.network.set(!Boolean(await desktop?.network.get())));net.textContent=n?'Online allowed':'Offline';net.classList.toggle('on',n);say(n?'Online tools allowed.':'Offline mode enabled.')});
window.addEventListener('load',async()=>{await desktop?.setInteractive(true);const n=Boolean(await desktop?.network.get());net.textContent=n?'Online allowed':'Offline';net.classList.toggle('on',n)});
window.matchMedia?.('(prefers-reduced-motion: reduce)').matches&&stage.classList.add('reduced');
</script>
</body>
</html>
