<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGE</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{font-family:Segoe UI,Arial,sans-serif;color:#fff6df;user-select:none;-webkit-user-select:none}.stage{position:relative;width:100%;height:100%}.sage-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 18px 4px 0;pointer-events:none}.sage{width:165px;height:308px;object-fit:contain;opacity:.58;pointer-events:auto;cursor:grab;-webkit-user-drag:none;user-drag:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.23));transition:opacity .3s,filter .3s,transform .18s}.sage.active{opacity:1;filter:drop-shadow(0 0 22px rgba(244,181,64,.42)) drop-shadow(0 10px 20px rgba(0,0,0,.3));transform:scale(1.015)}.sage:active{cursor:grabbing}.bubble{position:absolute;left:8px;top:8px;max-width:210px;padding:9px 12px;border:1px solid rgba(244,181,64,.55);border-radius:16px 16px 16px 5px;background:rgba(12,16,23,.95);box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:12px;line-height:1.35;opacity:0;pointer-events:none;transform:translateY(5px);transition:.2s;z-index:3}.bubble.show{opacity:1;transform:none}.panel{position:absolute;left:8px;bottom:8px;width:282px;padding:11px;border:1px solid rgba(244,181,64,.4);border-radius:17px;background:rgba(10,14,20,.97);box-shadow:0 18px 50px rgba(0,0,0,.44);opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s;z-index:4}.panel.show{opacity:1;pointer-events:auto;transform:none}.panel form{display:flex;gap:7px}.panel input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:inherit;padding:9px;outline:none}.panel button{border:0;border-radius:10px;background:#f0b44b;color:#18130a;font-weight:800;padding:0 11px;cursor:pointer}.close,.voice{margin-top:7px;width:100%;border:0;border-radius:9px;background:rgba(255,255,255,.08);color:#d8d0bf;padding:6px;cursor:pointer}.voice{border:1px solid rgba(244,181,64,.35);background:rgba(244,181,64,.08);color:#fff6df}.voice.listening{background:rgba(121,213,155,.16);border-color:rgba(121,213,155,.55);color:#bff3d1}.status{position:absolute;right:7px;bottom:4px;font-size:9px;color:rgba(255,246,223,.58);pointer-events:none}.net{position:absolute;left:6px;bottom:4px;border:0;background:none;color:rgba(255,246,223,.58);font-size:9px;cursor:pointer;z-index:5}.net.on{color:#79d59b}.float{animation:float 4.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}</style></head><body><main class="stage"><div class="bubble" id="bubble"></div><div class="sage-wrap"><img class="sage float" id="sage" src="./assets/sage-fullbody.svg" alt="SAGE desktop companion" draggable="false"></div><div class="status" id="status">Idle · 58%</div><button class="net" id="net">Offline</button><section class="panel" id="panel"><form id="form"><input id="message" autocomplete="off" maxlength="4000" placeholder="Talk to SAGE…"><button>Send</button></form><button class="voice" id="voice">🎙 Talk to SAGE</button><button class="close" id="close">Close</button></section></main><script>const sage=document.querySelector('#sage'),bubble=document.querySelector('#bubble'),panel=document.querySelector('#panel'),form=document.querySelector('#form'),input=document.querySelector('#message'),status=document.querySelector('#status'),net=document.querySelector('#net'),close=document.querySelector('#close'),voice=document.querySelector('#voice');let timer,hide,drag=false,last=null,moved=false;const state=(label,on=false)=>{sage.classList.toggle('active',on);status.textContent=on?label:'Idle · 58%';clearTimeout(timer);if(on)timer=setTimeout(()=>state('Idle · 58%'),6500)};const say=t=>{if(!t)return;bubble.textContent=t;bubble.classList.add('show');clearTimeout(hide);hide=setTimeout(()=>bubble.classList.remove('show'),4800)};const open=async()=>{state('Ready · SAGE',true);panel.classList.add('show');await window.sageDesktop?.setInteractive(true);input.focus()};const shut=async()=>{panel.classList.remove('show');await window.sageDesktop?.setInteractive(false);state('Idle · 58%')};sage.addEventListener('dragstart',e=>e.preventDefault());sage.addEventListener('dblclick',open);sage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});close.onclick=shut;sage.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();drag=true;moved=false;last={x:e.screenX,y:e.screenY};sage.setPointerCapture(e.pointerId);state('Awake · SAGE',true)});sage.addEventListener('pointermove',e=>{if(!drag||!last)return;e.preventDefault();const dx=e.screenX-last.x,dy=e.screenY-last.y;if(Math.abs(dx)+Math.abs(dy)>1){moved=true;window.sageDesktop?.moveBy?.(dx,dy);last={x:e.screenX,y:e.screenY}}});sage.addEventListener('pointerup',e=>{if(!drag)return;drag=false;last=null;sage.releasePointerCapture?.(e.pointerId);if(moved)say('Here we are.');state('Awake · SAGE',true)});sage.addEventListener('pointercancel',()=>{drag=false;last=null});async function ask(t){if(!t)return;state('Thinking · SAGE',true);say('Thinking…');try{const r=await window.sageDesktop?.ask(t);if(r?.ok){state('Speaking · SAGE',true);say(r.text);speak(r.text)}else say(r?.text||'I could not process that yet.')}catch{say('Something went wrong while I was thinking.')}}form.onsubmit=async e=>{e.preventDefault();const t=input.value.trim();input.value='';await ask(t)};function speak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.rate=.98;u.pitch=1.08;speechSynthesis.cancel();speechSynthesis.speak(u)}let rec=null,listening=false;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R){rec=new R();rec.lang='en-IN';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{listening=true;voice.classList.add('listening');voice.textContent='⏹ Listening…';state('Listening · SAGE',true);say('I’m listening.')};rec.onend=()=>{listening=false;voice.classList.remove('listening');voice.textContent='🎙 Talk to SAGE'};rec.onerror=()=>{listening=false;voice.classList.remove('listening');voice.textContent='🎙 Talk to SAGE';say('I couldn’t hear that. Try again.')};rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim();if(t){input.value=t;ask(t)}};voice.onclick=()=>{try{listening?rec.stop():rec.start()}catch{}}}else voice.disabled=true;net.onclick=async()=>{const n=Boolean(await window.sageDesktop?.network.set(!Boolean(await window.sageDesktop?.network.get())));net.textContent=n?'Online allowed':'Offline';net.classList.toggle('on',n);say(n?'Online tools allowed.':'Offline mode enabled.')};(async()=>{const n=Boolean(await window.sageDesktop?.network.get());net.textContent=n?'Online allowed':'Offline';net.classList.toggle('on',n)})();</script></body></html>
