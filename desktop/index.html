<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGE</title>
<style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#eaf7f0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center}.stage{position:relative;width:100%;height:100%;display:grid;place-items:center}.sage{width:180px;height:300px;opacity:.6;transform-origin:50% 90%;animation:float 4s ease-in-out infinite;transition:opacity .35s ease,filter .35s ease,transform .35s ease;cursor:pointer}.sage.active{opacity:1;filter:drop-shadow(0 0 18px rgba(91,189,138,.45));transform:scale(1.02)}.sage .eye{transform-box:fill-box;transform-origin:center;transition:transform .12s ease}.bubble{position:absolute;left:50%;top:8px;transform:translateX(-50%) translateY(8px);width:240px;padding:10px 13px;border:1px solid rgba(164,224,191,.22);border-radius:15px;background:rgba(7,18,14,.9);box-shadow:0 10px 32px rgba(0,0,0,.28);font-size:13px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}.panel{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:280px;padding:12px;border:1px solid rgba(164,224,191,.18);border-radius:18px;background:rgba(7,18,14,.96);box-shadow:0 18px 50px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .18s}.panel.show{opacity:1;pointer-events:auto}.panel form{display:flex;gap:7px}.panel input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:inherit;padding:9px;outline:none}.panel button{border:0;border-radius:10px;background:#70c99a;color:#082016;font-weight:700;padding:0 11px;cursor:pointer}.status{position:absolute;right:8px;bottom:3px;font-size:10px;color:#7f9d90}.net{position:absolute;left:8px;bottom:3px;font-size:10px;color:#7f9d90;cursor:pointer}.net.on{color:#9be7ba}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.sage{animation:none}}
</style>
</head>
<body><main class="stage"><div class="bubble" id="bubble"></div>
<svg class="sage" id="sage" viewBox="0 0 180 300" aria-label="SAGE desktop companion" tabindex="0">
<defs><linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163c2d"/><stop offset="1" stop-color="#0a2118"/></linearGradient><linearGradient id="apron" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8f0d2"/><stop offset="1" stop-color="#5bbd8a"/></linearGradient><radialGradient id="skin"><stop stop-color="#fff1e6"/><stop offset="1" stop-color="#e7c8b7"/></radialGradient></defs>
<ellipse cx="90" cy="285" rx="48" ry="8" fill="#63d19a" opacity=".18"/>
<path d="M42 91C34 43 57 17 91 17c39 0 61 31 48 77-7 27-25 43-49 43S47 118 42 91Z" fill="url(#hair)"/>
<path d="M52 76c0-31 16-47 39-47 27 0 42 20 38 49-4 31-22 46-39 46-22 0-38-20-38-48Z" fill="url(#skin)"/>
<path d="M50 70c6-29 20-43 42-43 25 0 39 18 41 41-13-9-22-22-26-36-13 16-32 25-57 28Z" fill="url(#hair)"/>
<ellipse class="eye" id="eye1" cx="76" cy="77" rx="5" ry="8" fill="#173d2e"/><ellipse class="eye" id="eye2" cx="104" cy="77" rx="5" ry="8" fill="#173d2e"/>
<path d="M80 98c6 5 14 5 20 0" fill="none" stroke="#173d2e" stroke-width="2.5" stroke-linecap="round"/>
<path d="M55 138c10-9 23-14 35-14s26 5 35 14l-7 17H62Z" fill="#173d2e"/>
<path d="M43 274c3-61 18-96 47-108 30 12 44 47 47 108Z" fill="url(#apron)"/>
<path d="M67 169h46M69 193h42" stroke="#3b8d67" stroke-width="3" stroke-linecap="round" opacity=".7"/>
<path d="M48 165c-18 14-25 35-22 57M132 165c18 14 25 35 22 57" fill="none" stroke="#e7c8b7" stroke-width="14" stroke-linecap="round"/>
<circle cx="26" cy="224" r="9" fill="#e7c8b7"/><circle cx="154" cy="224" r="9" fill="#e7c8b7"/>
<path d="M67 274h-7l-7 16h28l-5-16M113 274h7l7 16H99l5-16" fill="#163c2d"/>
</svg>
<div class="status" id="status">Idle · 60%</div><button class="net" id="net">Offline</button>
<section class="panel" id="panel"><form id="form"><input id="message" autocomplete="off" placeholder="Talk to SAGE…"><button>Send</button></form></section></main>
<script>
const sage=document.querySelector('#sage'),bubble=document.querySelector('#bubble'),panel=document.querySelector('#panel'),form=document.querySelector('#form'),input=document.querySelector('#message'),status=document.querySelector('#status'),net=document.querySelector('#net');let timer,hide;let active=false;
function state(label,on){active=on;sage.classList.toggle('active',on);status.textContent=on?label:'Idle · 60%';clearTimeout(timer);if(on)timer=setTimeout(()=>state('Idle · 60%',false),5000)}
function say(text){bubble.textContent=text;bubble.classList.add('show');clearTimeout(hide);hide=setTimeout(()=>bubble.classList.remove('show'),4200)}
function openPanel(){state('Ready · SAGE',true);panel.classList.add('show');input.focus();window.sageDesktop?.setInteractive(true)}
sage.addEventListener('dblclick',openPanel);sage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel()}});
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';state('Thinking · SAGE',true);say('Thinking…');const result=await window.sageDesktop?.ask(text);if(result?.ok){state('Speaking · SAGE',true);say(result.text);speak(result.text)}else say(result?.text||'I could not process that yet.')});
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.rate=.98;u.pitch=1.04;u.onstart=()=>state('Speaking · SAGE',true);u.onend=()=>state('Awake · SAGE',true);speechSynthesis.cancel();speechSynthesis.speak(u)}
net.addEventListener('click',async()=>{const current=await window.sageDesktop?.network.get();const next=!(current??false);await window.sageDesktop?.network.set(next);net.textContent=next?'Online allowed':'Offline';net.classList.toggle('on',next)});
window.addEventListener('mousemove',e=>{const r=sage.getBoundingClientRect();const x=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(r.width/2)));const y=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height*.3))/(r.height*.5)));document.querySelector('#eye1').style.transform=`translate(${x*2}px,${y*1.5}px)`;document.querySelector('#eye2').style.transform=`translate(${x*2}px,${y*1.5}px)`});
state('Idle · 60%',false);
</script></body></html>
