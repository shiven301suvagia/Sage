<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGE</title><style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#fff6df}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{user-select:none}.stage{position:relative;width:100%;height:100%;background:transparent}.sage-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 18px 4px 0;pointer-events:none}.sage{width:165px;height:308px;object-fit:contain;object-position:center bottom;opacity:.58;pointer-events:auto;cursor:grab;filter:drop-shadow(0 10px 18px rgba(0,0,0,.23));transition:opacity .32s ease,filter .32s ease,transform .18s ease}.sage.active{opacity:1;filter:drop-shadow(0 0 20px rgba(244,181,64,.36)) drop-shadow(0 10px 20px rgba(0,0,0,.26))}.sage:active{cursor:grabbing}.bubble{position:absolute;left:8px;top:9px;max-width:210px;padding:9px 12px;border:1px solid rgba(244,181,64,.56);border-radius:16px 16px 16px 5px;background:rgba(12,16,23,.95);box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:12px;line-height:1.35;opacity:0;pointer-events:none;transform:translateY(5px);transition:.2s;z-index:3}.bubble.show{opacity:1;transform:none}.panel{position:absolute;left:8px;bottom:8px;width:282px;padding:11px;border:1px solid rgba(244,181,64,.4);border-radius:17px;background:rgba(10,14,20,.97);box-shadow:0 18px 50px rgba(0,0,0,.44);opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s;z-index:4}.panel.show{opacity:1;pointer-events:auto;transform:none}.panel form{display:flex;gap:7px}.panel input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:inherit;padding:9px;outline:none}.panel button{border:0;border-radius:10px;background:#f0b44b;color:#18130a;font-weight:800;padding:0 11px;cursor:pointer}.close{margin-top:7px;width:100%;border:0;border-radius:9px;background:rgba(255,255,255,.08);color:#d8d0bf;padding:5px;cursor:pointer}.voice{margin-top:7px;width:100%;border:1px solid rgba(244,181,64,.35);border-radius:9px;background:rgba(244,181,64,.08);color:#fff6df;padding:7px;cursor:pointer}.voice.listening{background:rgba(121,213,155,.16);border-color:rgba(121,213,155,.55);color:#bff3d1}.status{position:absolute;right:7px;bottom:4px;font-size:9px;color:rgba(255,246,223,.58);pointer-events:none;z-index:2}.net{position:absolute;left:6px;bottom:4px;border:0;background:none;color:rgba(255,246,223,.58);font-size:9px;cursor:pointer;z-index:5}.net.on{color:#79d59b}.float{animation:float 4.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style></head><body><main class="stage"><div class="bubble" id="bubble" aria-live="polite"></div><div class="sage-wrap"><img class="sage float" id="sage" src="./assets/sage-fullbody.webp" alt="SAGE desktop companion" tabindex="0"></div><div class="status" id="status">Idle · 58%</div><button class="net" id="net" type="button">Offline</button><section class="panel" id="panel" aria-label="Talk to SAGE"><form id="form"><input id="message" autocomplete="off" maxlength="4000" placeholder="Talk to SAGE…"><button type="submit">Send</button></form><button class="voice" id="voice" type="button">🎙 Talk to SAGE</button><button class="close" id="close" type="button">Close</button></section></main><script>
const sage=document.querySelector('#sage'),bubble=document.querySelector('#bubble'),panel=document.querySelector('#panel'),form=document.querySelector('#form'),input=document.querySelector('#message'),status=document.querySelector('#status'),net=document.querySelector('#net'),close=document.querySelector('#close'),voice=document.querySelector('#voice');let idleTimer=0,hideTimer=0,dragging=false,dragStart=null,moved=false;
function setState(label,active=false){sage.classList.toggle('active',active);status.textContent=active?label:'Idle · 58%';clearTimeout(idleTimer);if(active)idleTimer=setTimeout(()=>setState('Idle · 58%',false),6500)}function say(text){if(!text)return;bubble.textContent=text;bubble.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>bubble.classList.remove('show'),4800)}async function openPanel(){setState('Ready · SAGE',true);panel.classList.add('show');await window.sageDesktop?.setInteractive(true);input.focus()}async function closePanel(){panel.classList.remove('show');await window.sageDesktop?.setInteractive(false);setState('Idle · 58%',false)}sage.addEventListener('dblclick',openPanel);sage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel()}});close.addEventListener('click',closePanel);
sage.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;moved=false;dragStart={x:e.screenX,y:e.screenY};sage.setPointerCapture(e.pointerId);setState('Awake · SAGE',true)});sage.addEventListener('pointermove',e=>{if(!dragging||!dragStart)return;const dx=e.screenX-dragStart.x,dy=e.screenY-dragStart.y;if(Math.abs(dx)+Math.abs(dy)<2)return;moved=true;window.sageDesktop?.moveBy?.(dx,dy);dragStart={x:e.screenX,y:e.screenY}});sage.addEventListener('pointerup',e=>{dragging=false;dragStart=null;sage.releasePointerCapture?.(e.pointerId);if(moved)say('Here we are.');setState('Awake · SAGE',true)});
async function ask(text){const clean=text?.trim();if(!clean)return;setState('Thinking · SAGE',true);say('Thinking…');try{const result=await window.sageDesktop?.ask(clean);if(result?.ok){setState('Speaking · SAGE',true);say(result.text);speak(result.text)}else say(result?.text||'I could not process that yet.')}catch{say('Something went wrong while I was thinking.')}}form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();input.value='';await ask(text)});function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.rate=.98;u.pitch=1.08;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
let recognition=null,listening=false;const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(Recognition){recognition=new Recognition();recognition.lang='en-IN';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;voice.classList.add('listening');voice.textContent='⏹ Listening…';setState('Listening · SAGE',true);say('I’m listening.');};recognition.onend=()=>{listening=false;voice.classList.remove('listening');voice.textContent='🎙 Talk to SAGE';};recognition.onerror=()=>{listening=false;voice.classList.remove('listening');voice.textContent='🎙 Talk to SAGE';say('I couldn’t hear that. Try again.');};recognition.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript?.trim();if(text){input.value=text;say(`I heard: “${text}”`);ask(text)}};voice.addEventListener('click',()=>{if(listening){try{recognition.stop()}catch{}}else{try{recognition.start()}catch{say('The microphone is already starting.')}})});}else{voice.textContent='🎙 Voice unavailable';voice.disabled=true}
net.addEventListener('click',async()=>{try{const current=Boolean(await window.sageDesktop?.network.get());const next=Boolean(await window.sageDesktop?.network.set(!current));net.textContent=next?'Online allowed':'Offline';net.classList.toggle('on',next);setState(next?'Online access allowed':'Offline mode',true);say(next?'Online tools are allowed.':'Offline mode is enabled.')}catch{say('I could not change the network setting.')}});(async()=>{const allowed=Boolean(await window.sageDesktop?.network.get());net.textContent=allowed?'Online allowed':'Offline';net.classList.toggle('on',allowed);setTimeout(()=>say('Hey. I’m Sage. I’m right here.'),900)})();
</script></body></html>
