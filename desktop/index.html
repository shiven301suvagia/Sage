<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGE</title>
<style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#eaf7f0;background:transparent}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:transparent;display:grid;place-items:center}.card{width:min(390px,94vw);min-height:560px;border:1px solid rgba(164,224,191,.2);border-radius:28px;background:linear-gradient(160deg,rgba(15,28,24,.96),rgba(7,14,12,.94));box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.07);-webkit-app-region:drag}.bar button{-webkit-app-region:no-drag}.title{font-weight:700;letter-spacing:.08em}.actions{display:flex;gap:6px}.icon{border:0;background:transparent;color:#b7c9c0;font-size:16px;cursor:pointer;padding:6px;border-radius:8px}.icon:hover{background:rgba(255,255,255,.08)}.sage{display:grid;place-items:center;padding:34px 20px 18px}.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#d9fff0 0 4%,#83d5ad 18%,#3e8e68 48%,#102d22 72%);box-shadow:0 0 60px rgba(98,206,155,.28);animation:float 4s ease-in-out infinite}.face{position:relative;width:100%;height:100%}.eye{position:absolute;top:58px;width:15px;height:23px;border-radius:50%;background:#082016}.eye.a{left:42px}.eye.b{right:42px}.smile{position:absolute;left:54px;right:54px;bottom:43px;height:22px;border-bottom:3px solid #082016;border-radius:0 0 50% 50%}.status{text-align:center;color:#91b4a4;font-size:13px}.chat{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 13px;border-radius:14px;max-width:88%;font-size:14px;line-height:1.4}.sageMsg{background:rgba(102,187,143,.12);align-self:flex-start}.userMsg{background:rgba(255,255,255,.08);align-self:flex-end}.input{display:flex;gap:8px;padding:14px;border-top:1px solid rgba(255,255,255,.07)}input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(255,255,255,.05);color:inherit;padding:11px 12px;outline:none}input:focus{border-color:#65b98c}button.send{border:0;border-radius:13px;padding:0 15px;background:#70c99a;color:#082016;font-weight:700;cursor:pointer}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body><main class="card"><header class="bar"><span class="title">SAGE</span><div class="actions"><button class="icon" id="pin" title="Always on top">⌖</button><button class="icon" id="center" title="Move to corner">◫</button><button class="icon" id="hide" title="Hide">—</button><button class="icon" id="close" title="Quit">×</button></div></header><section class="sage"><div class="orb"><div class="face"><i class="eye a"></i><i class="eye b"></i><i class="smile"></i></div></div><div class="status" id="status">Awake · ready</div></section><section class="chat" id="chat"><div class="msg sageMsg">Hey. I’m SAGE. I’m here. What are we working on?</div></section><form class="input" id="form"><input id="message" autocomplete="off" aria-label="Message SAGE" placeholder="Talk to SAGE…"><button class="send">Send</button></form></main>
<script>
const chat=document.querySelector('#chat'),input=document.querySelector('#message'),status=document.querySelector('#status');
const add=(text,cls)=>{const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight};
const reply=t=>{const x=t.toLowerCase();if(/^(hi|hello|hey)\b/.test(x))return'Hey. I’m here. What are we working on?';if(x.includes('thank'))return'Anytime. 🌱';if(x.includes('who are you'))return'I’m SAGE — your desktop companion. I’m designed to help without taking control away from you.';return'I heard you. I’m ready for the next step.'};
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t)return;add(t,'userMsg');input.value='';status.textContent='Thinking…';setTimeout(()=>{add(reply(t),'sageMsg');status.textContent='Awake · ready'},260)});
document.querySelector('#hide').onclick=()=>window.sageDesktop?.hide();document.querySelector('#close').onclick=()=>window.sageDesktop?.close();document.querySelector('#center').onclick=()=>window.sageDesktop?.center();document.querySelector('#pin').onclick=async()=>{const v=await window.sageDesktop?.toggleAlwaysOnTop();status.textContent=v?'Pinned · always on top':'Window mode · normal'};
</script></body></html>
