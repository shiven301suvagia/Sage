<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGE</title>
<style>
:root{--gold:#f2b84b;--cream:#fff4dc;--ink:#0b0f16;--panel:rgba(11,15,22,.96);--muted:#a9a39a;--line:rgba(242,184,75,.28)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--cream);font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}button{user-select:none}.app{position:relative;width:100%;height:100%}.character{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.sage{width:185px;height:345px;object-fit:contain;object-position:center bottom;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 12px 20px rgba(0,0,0,.3));opacity:.66;transition:filter .22s,opacity .22s,transform .22s}.sage.awake{opacity:1;filter:drop-shadow(0 0 26px rgba(242,184,75,.58)) drop-shadow(0 12px 24px rgba(0,0,0,.32));transform:scale(1.018)}.sage:active{cursor:grabbing}.status{position:absolute;right:9px;bottom:6px;color:rgba(255,244,220,.6);font-size:10px;pointer-events:none}.net{position:absolute;left:8px;bottom:5px;background:transparent;border:0;color:rgba(255,244,220,.6);font-size:10px;cursor:pointer}.net.on{color:#7ee2a5}.bubble{position:absolute;left:12px;top:12px;right:12px;padding:10px 12px;border:1px solid var(--line);border-radius:15px 15px 15px 5px;background:rgba(11,15,22,.96);box-shadow:0 12px 35px rgba(0,0,0,.35);font-size:12px;line-height:1.4;opacity:0;transform:translateY(7px);transition:.2s;pointer-events:none;z-index:3}.bubble.show{opacity:1;transform:none}.chat{position:absolute;inset:10px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 20px 65px rgba(0,0,0,.48);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;overflow:hidden}.chat.show{opacity:1;transform:none;pointer-events:auto}.head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08)}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(242,184,75,.6)}.mode{font-size:10px;color:var(--muted)}.messages{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px;user-select:text}.msg{max-width:88%;padding:9px 11px;border-radius:13px;font-size:12px;line-height:1.4;white-space:pre-wrap}.msg.sage{align-self:flex-start;background:rgba(242,184,75,.11);border:1px solid rgba(242,184,75,.15)}.msg.user{align-self:flex-end;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}.composer{padding:10px;border-top:1px solid rgba(255,255,255,.08)}form{display:flex;gap:7px}input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:var(--cream);outline:none;user-select:text}input:focus{border-color:rgba(242,184,75,.6);box-shadow:0 0 0 2px rgba(242,184,75,.1)}.send,.close{border:0;border-radius:12px;padding:0 13px;cursor:pointer}.send{background:var(--gold);color:#17120a;font-weight:800}.tools{display:flex;gap:7px;margin-top:7px}.tool{flex:1;padding:7px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#dcd5c7;cursor:pointer;font-size:10px}.tool:hover{background:rgba(255,255,255,.08)}.listening{border-color:rgba(126,226,165,.5);color:#bdf5d0}.float{animation:float 4.8s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style></head>
<body><main class="app" id="app">
<div class="bubble" id="bubble"></div><div class="character"><img id="sage" class="sage float" src="./assets/sage-fullbody.webp" alt="SAGE" draggable="false"></div>
<div class="status" id="status">Idle · ready</div><button class="net" id="net">Offline</button>
<section class="chat" id="chat"><header class="head"><div class="brand"><span class="dot"></span>SAGE</div><span class="mode" id="mode">Local-first</span></header><div class="messages" id="messages"></div><div class="composer"><form id="form"><input id="input" maxlength="4000" autocomplete="off" placeholder="Talk to SAGE…" aria-label="Message SAGE"><button class="send">Send</button></form><div class="tools"><button class="tool" id="talk">🎙 Talk</button><button class="tool" id="remember">Remember</button><button class="tool" id="close">Close</button></div></div></section></main>
<script>
const sage=document.querySelector('#sage'),chat=document.querySelector('#chat'),bubble=document.querySelector('#bubble'),status=document.querySelector('#status'),net=document.querySelector('#net'),mode=document.querySelector('#mode'),messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input'),close=document.querySelector('#close'),talk=document.querySelector('#talk'),remember=document.querySelector('#remember'),desktop=window.sageDesktop;
let dragging=false,last=null, moved=false, timer, bubbleTimer;
function state(text,awake=true){sage.classList.toggle('awake',awake);status.textContent=text;clearTimeout(timer);if(awake)timer=setTimeout(()=>state('Idle · ready',false),6000)}
function say(text){if(!text)return;bubble.textContent=text;bubble.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),5000)}
function add(role,text){const el=document.createElement('div');el.className=`msg ${role}`;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
async function openChat(){state('Awake · SAGE');await desktop?.resizeMode?.('chat');chat.classList.add('show');await desktop?.setInteractive?.();input.focus();if(!messages.children.length)add('sage','Hey! I’m Sage 🌱 I’m right here. What are we working on?')}
async function closeChat(){chat.classList.remove('show');await desktop?.resizeMode?.('compact');state('Idle · ready',false)}
sage.addEventListener('dragstart',e=>e.preventDefault());sage.addEventListener('dblclick',openChat);sage.addEventListener('click',()=>{if(!moved){state('Awake · SAGE')}});
sage.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();dragging=true;moved=false;last={x:e.screenX,y:e.screenY};sage.setPointerCapture(e.pointerId);state('Awake · SAGE')});sage.addEventListener('pointermove',e=>{if(!dragging||!last)return;e.preventDefault();const dx=e.screenX-last.x,dy=e.screenY-last.y;if(Math.abs(dx)+Math.abs(dy)>0){moved=true;void desktop?.moveBy?.(dx,dy);last={x:e.screenX,y:e.screenY}}});sage.addEventListener('pointerup',e=>{dragging=false;last=null;sage.releasePointerCapture?.(e.pointerId);if(moved)say('Moved. 🌱');state('Awake · SAGE')});sage.addEventListener('pointercancel',()=>{dragging=false;last=null});
async function ask(text){const t=String(text||'').trim();if(!t)return;add('user',t);input.value='';state('Thinking · SAGE');mode.textContent='Thinking';say('Thinking…');try{const r=await desktop?.ask?.(t);if(r?.ok){add('sage',r.text);say(r.text);speak(r.text);mode.textContent=r.source==='ollama'?'Local model':'Local-first';state('Speaking · SAGE')}else{add('sage',r?.text||'I’m having trouble responding right now.');say(r?.text||'I’m having trouble responding right now.');mode.textContent='Ready'}}catch(err){console.error(err);add('sage','Something went wrong, but I’m still here.');mode.textContent='Error'}}
form.addEventListener('submit',e=>{e.preventDefault();void ask(input.value)});close.addEventListener('click',closeChat);remember.addEventListener('click',()=>{input.value='Remember that ';input.focus()});
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.rate=.98;u.pitch=1.06;speechSynthesis.cancel();speechSynthesis.speak(u)}
const R=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;let listening=false;if(R){rec=new R();rec.lang='en-IN';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{listening=true;talk.classList.add('listening');talk.textContent='⏹ Listening…';state('Listening · SAGE');say('I’m listening.')};rec.onend=()=>{listening=false;talk.classList.remove('listening');talk.textContent='🎙 Talk'};rec.onerror=()=>say('I couldn’t hear that. Try again.');rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript;if(t)void ask(t)};talk.addEventListener('click',()=>{try{listening?rec.stop():rec.start()}catch{}})}else talk.disabled=true;
net.addEventListener('click',async()=>{const n=Boolean(await desktop?.network.set(!Boolean(await desktop?.network.get())));net.textContent=n?'Online allowed':'Offline';net.classList.toggle('on',n);say(n?'Online model access allowed.':'Offline mode enabled.')});
window.addEventListener('load',async()=>{await desktop?.setInteractive?.();const n=Boolean(await desktop?.network.get());net.textContent=n?'Online allowed':'Offline';net.classList.toggle('on',n)});
desktop?.onReminder?.(item=>{say(`Reminder: ${item.text}`);state('Reminder · SAGE');});
</script></body></html>
