<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGE</title>
<style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#eaf7f0;background:transparent}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center}.card{position:relative;width:100%;height:100%;display:grid;place-items:center;background:transparent}.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#d9fff0 0 4%,#83d5ad 18%,#3e8e68 48%,#102d22 72%);box-shadow:0 0 60px rgba(98,206,155,.28);animation:float 4s ease-in-out infinite;transition:opacity 320ms ease,transform 320ms ease,filter 320ms ease;opacity:.6;cursor:grab;-webkit-app-region:no-drag}.orb:active{cursor:grabbing}.orb.active{opacity:1}.orb.listening{box-shadow:0 0 75px rgba(98,206,155,.55);transform:scale(1.04);opacity:1}.face{position:relative;width:100%;height:100%}.eye{position:absolute;top:58px;width:15px;height:23px;border-radius:50%;background:#082016}.eye.a{left:42px}.eye.b{right:42px}.smile{position:absolute;left:54px;right:54px;bottom:43px;height:22px;border-bottom:3px solid #082016;border-radius:0 0 50% 50%}.bubble{position:absolute;left:50%;bottom:calc(50% + 88px);transform:translateX(-50%) translateY(6px);width:230px;max-height:100px;overflow:hidden;padding:10px 13px;border:1px solid rgba(164,224,191,.22);border-radius:15px;background:rgba(7,18,14,.9);box-shadow:0 10px 32px rgba(0,0,0,.28);font-size:13px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity 220ms ease,transform 220ms ease}.bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}.bubble:after{content:'';position:absolute;bottom:-6px;left:50%;width:12px;height:12px;background:rgba(7,18,14,.9);border-right:1px solid rgba(164,224,191,.22);border-bottom:1px solid rgba(164,224,191,.22);transform:translateX(-50%) rotate(45deg)}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:280px;padding:12px;border:1px solid rgba(164,224,191,.18);border-radius:18px;background:rgba(7,18,14,.96);box-shadow:0 18px 50px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity 180ms ease}.panel.show{opacity:1;pointer-events:auto}.panel form{display:flex;gap:7px}.panel input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:inherit;padding:9px;outline:none}.panel button{border:0;border-radius:10px;background:#70c99a;color:#082016;font-weight:700;padding:0 11px;cursor:pointer}.tools{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:#7f9d90}.drag{position:absolute;inset:0;z-index:-1;-webkit-app-region:drag}.status{position:absolute;bottom:5px;font-size:10px;color:#7f9d90;opacity:.8}.idleHint{position:absolute;bottom:18px;font-size:10px;color:#7f9d90;opacity:0;transition:opacity 300ms}.idleHint.show{opacity:.75}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.orb{animation:none;transition:none}}
</style>
</head>
<body><main class="card"><div class="drag" aria-hidden="true"></div><div class="bubble" id="bubble" role="status"></div><div class="orb" id="orb" aria-label="SAGE companion" tabindex="0"><div class="face"><i class="eye a"></i><i class="eye b"></i><i class="smile"></i></div></div><div class="status" id="status">Idle · 60%</div><div class="idleHint" id="hint">Double-click SAGE to talk</div><section class="panel" id="panel"><form id="form"><input id="message" autocomplete="off" aria-label="Message SAGE" placeholder="Talk to SAGE…"><button type="submit">Send</button></form><div class="tools"><span>Enter · send</span><button id="closePanel" type="button">Close</button></div></section></main>
<script>
const orb=document.querySelector('#orb'),bubble=document.querySelector('#bubble'),status=document.querySelector('#status'),hint=document.querySelector('#hint'),panel=document.querySelector('#panel'),form=document.querySelector('#form'),input=document.querySelector('#message'),closePanel=document.querySelector('#closePanel');
let activeTimer,hideTimer,dragging=false,dragOffset={x:0,y:0};
const setState=(state,active)=>{orb.classList.toggle('active',active);status.textContent=active?state:'Idle · 60%'};
const say=(text,ms=4200)=>{if(!text)return;bubble.textContent=text;bubble.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>bubble.classList.remove('show'),ms)};
const activate=(state='Awake · SAGE')=>{setState(state,true);clearTimeout(activeTimer);activeTimer=setTimeout(()=>setState('Idle · 60%',false),5000)};
const openPanel=()=>{activate('Ready · SAGE');panel.classList.add('show');input.focus()};
orb.addEventListener('dblclick',openPanel);orb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel()}});
closePanel.onclick=()=>panel.classList.remove('show');
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;activate('Thinking · SAGE');say('Thinking…',1800);input.value='';try{const result=await window.sageDesktop?.ask(text);if(result?.ok&&result.text){activate('Speaking · SAGE');say(result.text);speak(result.text)}else say(result?.text||'I could not process that yet.');}catch{say('I hit a local connection problem. Please try again.')}});
const speak=text=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.98;u.pitch=1.04;u.volume=.9;u.onstart=()=>activate('Speaking · SAGE');u.onend=()=>setState('Awake · SAGE',true);speechSynthesis.speak(u)};
let idle=0;setInterval(()=>{idle+=1000;if(idle>8000)hint.classList.add('show');else hint.classList.remove('show')},1000);['mousemove','keydown','click','wheel'].forEach(evt=>window.addEventListener(evt,()=>{idle=0;hint.classList.remove('show')}));
orb.addEventListener('pointerdown',e=>{if(e.button!==0||panel.classList.contains('show'))return;dragging=true;orb.setPointerCapture(e.pointerId);dragOffset={x:e.clientX-orb.getBoundingClientRect().left,y:e.clientY-orb.getBoundingClientRect().top};activate('Moving · SAGE')});orb.addEventListener('pointermove',e=>{if(!dragging)return;window.sageDesktop?.move(e.screenX-dragOffset.x,e.screenY-dragOffset.y)});orb.addEventListener('pointerup',()=>{dragging=false;setState('Idle · 60%',false)});
window.addEventListener('mousemove',()=>{if(!dragging){const r=orb.getBoundingClientRect();const x=Math.max(-1,Math.min(1,(event.clientX-(r.left+r.width/2))/(r.width/2)));const y=Math.max(-1,Math.min(1,(event.clientY-(r.top+r.height/2))/(r.height/2)));orb.querySelectorAll('.eye').forEach(el=>el.style.transform=`translate(${x*3}px,${y*2}px)`)}});
setState('Idle · 60%',false);
</script></body></html>
