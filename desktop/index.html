<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGE</title>
<style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#eaf7f0;background:transparent}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:transparent;display:grid;place-items:center}.card{width:min(390px,94vw);min-height:560px;border:1px solid rgba(164,224,191,.2);border-radius:28px;background:linear-gradient(160deg,rgba(15,28,24,.96),rgba(7,14,12,.94));box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.07);-webkit-app-region:drag}.bar button{-webkit-app-region:no-drag}.title{font-weight:700;letter-spacing:.08em}.actions{display:flex;gap:6px}.icon{border:0;background:transparent;color:#b7c9c0;font-size:16px;cursor:pointer;padding:6px;border-radius:8px}.icon:hover{background:rgba(255,255,255,.08)}.sage{display:grid;place-items:center;padding:28px 20px 14px}.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#d9fff0 0 4%,#83d5ad 18%,#3e8e68 48%,#102d22 72%);box-shadow:0 0 60px rgba(98,206,155,.28);animation:float 4s ease-in-out infinite;transition:.25s}.orb.listening{box-shadow:0 0 75px rgba(98,206,155,.55);transform:scale(1.04)}.face{position:relative;width:100%;height:100%}.eye{position:absolute;top:58px;width:15px;height:23px;border-radius:50%;background:#082016}.eye.a{left:42px}.eye.b{right:42px}.smile{position:absolute;left:54px;right:54px;bottom:43px;height:22px;border-bottom:3px solid #082016;border-radius:0 0 50% 50%}.status{text-align:center;color:#91b4a4;font-size:13px;margin-top:8px}.chat{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 13px;border-radius:14px;max-width:88%;font-size:14px;line-height:1.4;white-space:pre-wrap}.sageMsg{background:rgba(102,187,143,.12);align-self:flex-start}.userMsg{background:rgba(255,255,255,.08);align-self:flex-end}.input{display:flex;gap:8px;padding:14px;border-top:1px solid rgba(255,255,255,.07)}input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(255,255,255,.05);color:inherit;padding:11px 12px;outline:none}input:focus{border-color:#65b98c}button.send,button.mic{border:0;border-radius:13px;padding:0 13px;background:#70c99a;color:#082016;font-weight:700;cursor:pointer}.mic{min-width:42px}.mic.active{outline:2px solid rgba(112,201,154,.5)}.hint{font-size:11px;color:#708e81;text-align:center;padding:0 14px 9px}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body><main class="card"><header class="bar"><span class="title">SAGE</span><div class="actions"><button class="icon" id="pin" title="Always on top">⌖</button><button class="icon" id="center" title="Move to corner">◫</button><button class="icon" id="hide" title="Hide">—</button><button class="icon" id="close" title="Quit">×</button></div></header><section class="sage"><div class="orb" id="orb"><div class="face"><i class="eye a"></i><i class="eye b"></i><i class="smile"></i></div></div><div class="status" id="status">Awake · ready</div></section><section class="chat" id="chat" aria-live="polite"></section><form class="input" id="form"><input id="message" autocomplete="off" aria-label="Message SAGE" placeholder="Talk to SAGE…"><button class="mic" id="mic" type="button" title="Voice input">🎙</button><button class="send">Send</button></form><div class="hint">Ctrl + Shift + S · show/hide SAGE</div></main>
<script>
const chat=document.querySelector('#chat'),input=document.querySelector('#message'),status=document.querySelector('#status'),orb=document.querySelector('#orb'),mic=document.querySelector('#mic');
const STORAGE='sage.desktop.chat.v1';
let history=[];
const add=(text,cls,save=true)=>{const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight;if(save){history.push({text,cls});history=history.slice(-80);localStorage.setItem(STORAGE,JSON.stringify(history));}};
try{history=JSON.parse(localStorage.getItem(STORAGE)||'[]');if(!Array.isArray(history))history=[];}catch{history=[]}
if(history.length){for(const item of history){if(item&&typeof item.text==='string'&&typeof item.cls==='string')add(item.text,item.cls,false)}}else add('Hey. I’m SAGE. I’m here. What are we working on?','sageMsg');
const ask=async text=>{try{const result=await window.sageDesktop?.ask(text);if(result?.ok&&result.text)return result.text;return result?.text||'I could not process that yet.'}catch{return'I hit a local connection problem. Please try again.'}};
const speak=text=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.98;u.pitch=1.04;u.volume=.9;u.onstart=()=>status.textContent='Speaking · SAGE';u.onend=()=>status.textContent='Awake · ready';speechSynthesis.speak(u)};
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const t=input.value.trim();if(!t)return;add(t,'userMsg');input.value='';status.textContent='Thinking · SAGE';orb.classList.remove('listening');const text=await ask(t);add(text,'sageMsg');speak(text);if(!('speechSynthesis'in window))status.textContent='Awake · ready'});
document.querySelector('#hide').onclick=()=>window.sageDesktop?.hide();document.querySelector('#close').onclick=()=>window.sageDesktop?.close();document.querySelector('#center').onclick=()=>window.sageDesktop?.center();document.querySelector('#pin').onclick=async()=>{const v=await window.sageDesktop?.toggleAlwaysOnTop();status.textContent=v?'Pinned · always on top':'Window mode · normal'};
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Recognition){mic.title='Voice input unavailable in this environment';mic.disabled=true;mic.style.opacity='.45'}else{const recognition=new Recognition();recognition.lang=navigator.language||'en-US';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{mic.classList.add('active');orb.classList.add('listening');status.textContent='Listening · SAGE'};recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};recognition.onerror=()=>{status.textContent='Voice input unavailable';mic.classList.remove('active');orb.classList.remove('listening')};recognition.onend=()=>{mic.classList.remove('active');orb.classList.remove('listening');if(status.textContent==='Listening · SAGE')status.textContent='Awake · ready'};mic.onclick=()=>{try{recognition.start()}catch{recognition.stop()}}}
</script></body></html>
