<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGE</title><link rel="stylesheet" href="./styles.css"></head><body><div class="stage"><div id="bubble" class="bubble" role="status" aria-live="polite"></div><section id="chat" class="chat" aria-label="Talk to SAGE"><header><div><strong>SAGE</strong><span id="chat-status">Listening</span></div><button id="chat-close" class="icon" aria-label="Close chat">×</button></header><div id="messages" class="messages"></div><section id="settings" class="settings" hidden aria-label="SAGE settings"><div class="settings-head"><strong>Memory & privacy</strong><button id="settings-close" class="icon" aria-label="Close settings">×</button></div><p class="settings-note">Your memories stay local to this computer. Remove individual items or clear everything at any time.</p><div id="memory-list" class="memory-list"></div><div class="settings-actions"><button id="memory-refresh" class="chip">Refresh</button><button id="memory-export" class="chip">Export JSON</button><button id="memory-clear" class="chip danger">Clear all</button></div><div class="preference-list"><label><input id="pref-network" type="checkbox"> Online access</label><label><input id="pref-proactive" type="checkbox"> Proactive help</label><label><input id="pref-voice" type="checkbox"> Voice input</label></div></section><form id="form"><input id="message" maxlength="4000" autocomplete="off" placeholder="Ask me anything…"><button class="send">➤</button></form><footer><button id="network" class="chip">Offline</button><button id="proactive" class="chip">Proactive off</button><button id="speak" class="chip">Voice</button><button id="settings-open" class="chip">Memory</button><button id="topmost" class="chip">Always on top</button></footer></section><div id="pet" class="pet" tabindex="0" aria-label="SAGE desktop companion"><div class="glow"></div><img id="sage" src="./assets/sage.svg" alt="SAGE"><i>✦</i><b>✧</b></div><button id="status" class="status">Idle</button></div><script type="module" src="./app.mjs"></script></body></html>
