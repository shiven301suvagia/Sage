<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGE</title><link rel="stylesheet" href="./styles.css"></head><body><div class="stage"><div id="bubble" class="bubble" role="status" aria-live="polite"></div><section id="chat" class="chat" aria-label="Talk to SAGE"><header><div><strong>SAGE</strong><span id="chat-status">Listening</span></div><button id="chat-close" class="icon" aria-label="Close chat">×</button></header><div id="messages" class="messages"></div><form id="form"><input id="message" maxlength="4000" autocomplete="off" placeholder="Ask me anything…"><button class="send">➤</button></form><footer><button id="network" class="chip">Offline</button><button id="proactive" class="chip">Proactive off</button><button id="speak" class="chip">Voice</button><button id="topmost" class="chip">Always on top</button></footer></section><div id="pet" class="pet" tabindex="0" aria-label="SAGE desktop companion"><div class="glow"></div><img id="sage" src="./assets/sage.svg" alt="SAGE"><i>✦</i><b>✧</b></div><button id="status" class="status">Idle</button></div><script type="module" src="./app.mjs"></script></body></html>
