<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://127.0.0.1:11434 https://api.openai.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none';"><title>SAGE</title><link rel="stylesheet" href="./styles.css"></head><body><main class="pet-stage"><section id="chat" class="chat" aria-label="SAGE chat" hidden><header class="chat-head"><div><strong>SAGE</strong><span id="chat-state">sleeping</span></div><div class="chat-actions"><button id="clear-chat" class="small-button" type="button">Clear</button><button id="close-chat" class="icon-button" type="button" aria-label="Close chat">×</button></div></header><div id="messages" class="messages" role="log" aria-live="polite"></div><form id="composer" class="composer"><input id="prompt" name="prompt" maxlength="4000" autocomplete="off" placeholder="Talk to Sage…" aria-label="Message Sage"><button id="send" type="submit">Send</button></form></section><div id="bubble" class="speech" role="status" aria-live="polite"></div><div id="pet" class="pet" tabindex="0" aria-label="SAGE desktop companion" role="button"><div class="sleep-z" aria-hidden="true">z</div><div class="glow" aria-hidden="true"></div><img id="sage" src="./assets/sage.svg" alt="SAGE" draggable="false"></div><button id="status" class="status" type="button" aria-label="SAGE status">sleeping</button></main><script type="module" src="./app.mjs"></script></body></html>
