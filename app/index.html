<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGE</title>
<style>
:root{--gold:#ffc94d;--cream:#fff6e6;--green:#bfe0c2;--panel:rgba(10,14,21,.97);--muted:#a8a39a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--cream);font-family:Segoe UI,system-ui,sans-serif}button,input{font:inherit}button{border:0}.root{position:relative;width:100%;height:100%}.presence{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.sage{width:190px;height:360px;object-fit:contain;object-position:center bottom;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.3));opacity:.62;transition:opacity .25s,filter .25s,transform .25s}.sage.awake{opacity:1;filter:drop-shadow(0 0 25px rgba(255,201,77,.72)) drop-shadow(0 14px 22px rgba(0,0,0,.35));transform:translateY(-2px) scale(1.015)}.sage.thinking{animation:breathe 1.5s ease-in-out infinite}.sage.sleeping{opacity:.3;filter:grayscale(.25)}@keyframes breathe{50%{transform:translateY(-5px) scale(1.018)}}.status{position:absolute;right:7px;bottom:6px;font-size:10px;color:rgba(255,246,230,.58);pointer-events:none}.network{position:absolute;left:7px;bottom:5px;background:transparent;color:rgba(255,246,230,.58);font-size:10px;cursor:pointer}.network.on{color:var(--green)}.bubble{position:absolute;left:9px;right:9px;top:9px;padding:10px 12px;border:1px solid rgba(255,201,77,.35);border-radius:16px 16px 16px 5px;background:rgba(10,14,21,.96);box-shadow:0 15px 40px rgba(0,0,0,.38);font-size:12px;line-height:1.4;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:5}.bubble.show{opacity:1;transform:none}.chat{position:absolute;inset:8px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,201,77,.34);border-radius:22px;background:var(--panel);box-shadow:0 22px 70px rgba(0,0,0,.52);opacity:0;transform:scale(.98) translateY(8px);pointer-events:none;transition:.2s}.chat.show{opacity:1;transform:none;pointer-events:auto}.header{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.07)}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}.flower{color:var(--gold);font-size:18px}.sub{font-size:10px;color:var(--muted)}.close{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);color:#ddd5c7;cursor:pointer}.messages{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;user-select:text}.msg{max-width:84%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45;white-space:pre-wrap}.msg.sage{align-self:flex-start;background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.14)}.msg.user{align-self:flex-end;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.07)}.composer{flex:0 0 auto;padding:10px;border-top:1px solid rgba(255,255,255,.07)}form{display:flex;gap:8px}input{min-width:0;flex:1;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.05);color:var(--cream);padding:11px 12px;outline:none;user-select:text}input:focus{border-color:rgba(255,201,77,.58);box-shadow:0 0 0 2px rgba(255,201,77,.08)}.send{padding:0 15px;border-radius:13px;background:var(--gold);color:#171209;font-weight:800;cursor:pointer}.actions{display:flex;gap:7px;margin-top:8px}.action{flex:1;padding:8px;border-radius:10px;background:rgba(255,255,255,.05);color:#d8d0c1;cursor:pointer;font-size:11px}.action:hover{background:rgba(255,255,255,.09)}.action.active{color:var(--green);border:1px solid rgba(191,224,194,.35)}.hint{margin-top:7px;text-align:center;font-size:9px;color:rgba(255,246,230,.35)}
</style></head>
<body><main class="root"><div class="presence"><img id="sage" class="sage" src="../desktop/assets/sage-fullbody.webp" alt="SAGE desktop companion" draggable="false"></div><div id="bubble" class="bubble"></div><div id="status" class="status">Idle · 60%</div><button id="network" class="network">Offline</button><section id="chat" class="chat"><header class="header"><div><div class="brand"><span class="flower">✿</span>SAGE</div><div id="mode" class="sub">Your desktop companion · Local-first</div></div><button id="close" class="close" aria-label="Close chat">×</button></header><div id="messages" class="messages"></div><div class="composer"><form id="form"><input id="input" maxlength="4000" autocomplete="off" placeholder="Talk to SAGE…" aria-label="Message SAGE"><button class="send">Send</button></form><div class="actions"><button id="talk" class="action">🎙 Talk</button><button id="remember" class="action">Remember</button><button id="clear" class="action">Clear chat</button></div><div class="hint">Double-click SAGE to open chat · Ctrl+Shift+S hides/shows her</div></div></section></main>
<script>
const api=window.sage;const sage=document.querySelector('#sage'),chat=document.querySelector('#chat'),bubble=document.querySelector('#bubble'),status=document.querySelector('#status'),network=document.querySelector('#network'),messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input'),close=document.querySelector('#close'),talk=document.querySelector('#talk'),remember=document.querySelector('#remember'),clear=document.querySelector('#clear'),mode=document.querySelector('#mode');
let dragging=false,last=null,moved=false,dragTimer=null,bubbleTimer=null;
function state(label,kind='awake'){sage.classList.remove('awake','thinking','sleeping');if(kind==='awake')sage.classList.add('awake');if(kind==='thinking')sage.classList.add('awake','thinking');if(kind==='sleeping')sage.classList.add('sleeping');status.textContent=label;clearTimeout(dragTimer);if(kind!=='sleeping')dragTimer=setTimeout(()=>{sage.classList.remove('awake','thinking');status.textContent='Idle · 60%'},5500)}
function say(text){if(!text)return;bubble.textContent=text;bubble.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),4500)}
function add(role,text){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
async function openChat(){await api?.window.resize('chat');chat.classList.add('show');state('Ready · SAGE');if(!messages.children.length)add('sage','Hey, Shiven. ✨\nI’m Sage. I’m right here. What are we working on?');setTimeout(()=>input.focus(),120)}
async function closeChat(){chat.classList.remove('show');await api?.window.resize('compact');state('Idle · 60%','sleeping');setTimeout(()=>sage.classList.remove('sleeping'),500)}
sage.addEventListener('dragstart',e=>e.preventDefault());sage.addEventListener('dblclick',()=>void openChat());sage.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();dragging=true;moved=false;last={x:e.screenX,y:e.screenY};sage.setPointerCapture(e.pointerId);state('Awake · SAGE')});sage.addEventListener('pointermove',e=>{if(!dragging||!last)return;e.preventDefault();const dx=e.screenX-last.x,dy=e.screenY-last.y;if(dx||dy){moved=true;void api?.window.moveBy(dx,dy);last={x:e.screenX,y:e.screenY}}});sage.addEventListener('pointerup',e=>{dragging=false;last=null;sage.releasePointerCapture?.(e.pointerId);if(moved){say('Right here. 🌱');state('Awake · SAGE')}else state('Listening · SAGE')});sage.addEventListener('pointercancel',()=>{dragging=false;last=null});
async function ask(text){const t=String(text||'').trim();if(!t)return;add('user',t);input.value='';state('Thinking · SAGE','thinking');mode.textContent='Thinking…';try{const r=await api.ask(t);if(r?.ok){add('sage',r.text);say(r.text);speak(r.text);mode.textContent=r.source==='ollama'?'Local model':r.source==='openai'?'Online model':r.source==='reminder'?'Reminder':'Local-first';state('Speaking · SAGE')}else{add('sage',r?.text||'I’m here, but I couldn’t process that.');state('Concerned · SAGE')}}catch(err){console.error(err);add('sage','Something went wrong on my side. I’m still here.');mode.textContent='Error'}}
form.addEventListener('submit',e=>{e.preventDefault();void ask(input.value)});close.addEventListener('click',()=>void closeChat());remember.addEventListener('click',()=>{input.value='Remember that ';input.focus()});clear.addEventListener('click',()=>{messages.innerHTML='';add('sage','Chat cleared. I’m listening. 🌱')});
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.rate=.98;u.pitch=1.06;speechSynthesis.cancel();speechSynthesis.speak(u)}
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;if(Recognition){rec=new Recognition();rec.lang='en-IN';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>{talk.classList.add('active');talk.textContent='⏹ Listening…';state('Listening · SAGE')};rec.onend=()=>{talk.classList.remove('active');talk.textContent='🎙 Talk'};rec.onerror=()=>say('I couldn’t hear that. Try again.');rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript;if(t)void ask(t)};talk.addEventListener('click',()=>{try{rec.start()}catch{}})}else talk.disabled=true;
network.addEventListener('click',async()=>{const n=Boolean(await api.network.set(!Boolean(await api.network.get())));network.textContent=n?'Online allowed':'Offline';network.classList.toggle('on',n);say(n?'Online model access allowed.':'Offline mode enabled.')});api?.onReminder?.(item=>{say('Reminder: '+item.text);state('Reminder · SAGE')});window.addEventListener('load',async()=>{const n=Boolean(await api?.network.get?.());network.textContent=n?'Online allowed':'Offline';network.classList.toggle('on',n);await api?.window.resize('compact')});
</script></body></html>
